<body>

    <h1>审美积累。。</h1>

    <p>什么是神明？</p>


    <div class="card">
        "梦里，我立于悬崖之巅。回眸，神明微笑着向我伸出手。那笑容太过慈悲，以至于我毫无戒备地握住了他的手。随后，我坠落了。将我推下深渊的人，不是恶魔，而是神。那深渊有一个很好听的名字——乌托邦。"
        <br>
        —— Unknown
    </div>


    <div class="card">
        "人，这种自私而贪婪的生物，若真是神亲手创造，那么人性的卑劣，究竟该归咎于造物，还是造物者？"
        <br>
        —— Unknown
    </div>


</body>
